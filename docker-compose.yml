services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manahome}
      POSTGRES_USER: ${POSTGRES_USER:-manahome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manahome}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requis}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET requis}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-manahome-medias}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-gra}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      FEATURE_GEDEON: ${FEATURE_GEDEON:-false}

  # Moisson territoriale : geo + géorisques mensuel, DVF trimestriel —
  # idempotent, zéro scraping, clés API dans .env
  moisson-territoires:
    image: python:3.12-alpine
    profiles: ["moisson"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL requis}
    volumes:
      - ./moissons:/moissons:ro
    entrypoint: ["sh", "-c", "pip install --quiet psycopg[binary] && python /moissons/territoires.py $${CODE_INSEE:-29042} && psql \"$${DATABASE_URL}\" -c 'SELECT consolide_territoire(\"$${CODE_INSEE:-29042}\")'"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./site:/srv/site:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
